# On every push and pull request: the whole gate, which needs Docker for the test containers.
# All logic lives in fsd.toml; this file only installs the toolchain and asks fsd to run it.
name: gate

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install "poetry>=2.2,<3"
      - run: pipx install forktex-fsd
      - run: fsd setup
      - run: fsd assurance
      - run: fsd security
      - run: fsd documentation
      - run: fsd build
